name: CI Pipeline

# Runs on pushes and pull requests for all branches
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

env:
  NODE_VERSION: '20' # Adjust according to your Node.js version

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checks out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Detects package manager (npm or yarn)
      - name: Detect Package Manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      # Sets up Node.js with dynamic cache based on package manager
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      # Installs dependencies using detected package manager
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      # Builds with Turborepo using detected runner
      - name: Build
        run: ${{ steps.detect-package-manager.outputs.runner }} turbo run build

      # Runs linting using detected runner
      - name: Run lint
        run: ${{ steps.detect-package-manager.outputs.runner }} turbo run lint

      # Runs tests using detected runner
      - name: Run tests
        run: ${{ steps.detect-package-manager.outputs.runner }} turbo run test

      # Turborepo cache setup
      - name: Setup Turborepo cache
        uses: actions/cache@v3
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles(steps.detect-package-manager.outputs.manager == 'yarn' && 'yarn.lock' || 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-