<!DOCTYPE html>
<html>
  <head>
    <title>Silent Renew</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3.4.1/dist/browser/oidc-client-ts.min.js"></script>
    <script>
      if (window.oidc) {
        const userStore = new oidc.WebStorageStateStore({
          store: window.localStorage,
        });
        const userManager = new oidc.UserManager({
          userStore,
        });

        userManager.signinSilentCallback().catch(function () {
          // The identity provider may reject silent sign-in for anonymous visitors.
        });
      }
    </script>
  </body>
</html>
